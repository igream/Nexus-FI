server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker: se vuelve a resolver 'backend' cada 10 s, así Nginx sigue
    # funcionando si el contenedor del backend se recrea con otra IP (evita el 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location / {
        # 'backend' es el nombre del servicio FastAPI en docker-compose
        proxy_pass $backend_upstream;

        # ====================================================================
        # DIRECTIVAS CRÍTICAS PARA EL FILTRADO POR IP (WBS 1.3.5)
        # ====================================================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx es el borde: se reemplaza (no se concatena) cualquier X-Forwarded-For
        # enviado por el cliente, para que no pueda falsificar una IP de la FI.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte para WebSockets y Streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tiempos de espera
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
    }
}