services:
  # Servicio Backend (FastAPI / Uvicorn)
  backend:
    build: .
    container_name: nexus_backend
    restart: always
    # Solo accesible dentro de la red de Docker: todo el tráfico entra por Nginx.
    expose:
      - "8000"
    env_file:
      - .env
    # Límite de consultas por usuario registrado (WBS 1.4.2): activo salvo que el .env diga false.
    environment:
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    # Base vectorial (data/lancedb) y base de usuarios (data/usuarios.db) fuera de la imagen:
    # no se pierden al reconstruir el contenedor y nunca se suben a Git.
    volumes:
      - ./data:/app/data

  # Servicio Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend