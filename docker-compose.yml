services:
  # Servicio Backend (FastAPI / Uvicorn)
  backend:
    build: .
    container_name: nexus_backend
    restart: always
    # Solo accesible dentro de la red de Docker: todo el tráfico entra por Nginx,
    # así el filtro perimetral (WBS 1.3.5) siempre recibe la IP real del cliente.
    expose:
      - "8000"
    env_file:
      - .env
    # Modo de seguridad: desarrollo por defecto (o lo que diga el .env).
    # Para la prueba final o producción:
    #   docker compose -f docker-compose.yml -f docker-compose.fi.yml up -d
    environment:
      IP_FILTER_ENABLED: ${IP_FILTER_ENABLED:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}

  # Servicio Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend