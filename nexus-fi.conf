# =============================================================================
# nginx/nexus-fi.conf
# Configuración Nginx para Nexus FI — AWS EC2
# Facultad de Ingeniería UAEMéx — Equipo 404
#
# Coordinación: Ángel Israel — Avance 2 (WBS 1.3.5 / 1.4.2)
# =============================================================================

upstream nexus_fi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # -------------------------------------------------------------------------
    # Seguridad básica
    # -------------------------------------------------------------------------
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Propagación de IP real del cliente hacia FastAPI
    # Requerido por WBS 1.3.5 para el filtrado perimetral por IP
    # -------------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    # -------------------------------------------------------------------------
    # Soporte WebSockets (para actualizaciones en tiempo real)
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # -------------------------------------------------------------------------
    # Timeouts extendidos para llamadas a Gemini API (inferencia IA)
    # -------------------------------------------------------------------------
    proxy_connect_timeout   30s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;
    send_timeout            120s;

    # -------------------------------------------------------------------------
    # Límites de tamaño para subida de documentos
    # -------------------------------------------------------------------------
    client_max_body_size    50M;

    # -------------------------------------------------------------------------
    # Archivos estáticos — servidos directamente por Nginx
    # (más eficiente que pasarlos por FastAPI)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /home/ubuntu/nexus-fi-avance2/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # -------------------------------------------------------------------------
    # Ruta raíz — proxy a FastAPI para servir index.html
    # -------------------------------------------------------------------------
    location = / {
        proxy_pass http://nexus_fi_backend;
    }

    # -------------------------------------------------------------------------
    # API — proxy a FastAPI (aplican WBS 1.3.5 y WBS 1.4.2)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://nexus_fi_backend;
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;

        # Exponer headers de rate limiting al cliente (WBS 1.4.2)
        add_header Access-Control-Expose-Headers
            "X-RateLimit-Limit-Hour, X-RateLimit-Remaining-Hour,
             X-RateLimit-Limit-Day, X-RateLimit-Remaining-Day, Retry-After" always;
    }

    # -------------------------------------------------------------------------
    # Documentación interactiva de FastAPI (solo acceso interno)
    # -------------------------------------------------------------------------
    location /docs {
        proxy_pass http://nexus_fi_backend;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    location /redoc {
        proxy_pass http://nexus_fi_backend;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    location /openapi.json {
        proxy_pass http://nexus_fi_backend;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    # -------------------------------------------------------------------------
    # Ruta general — todos los demás endpoints a FastAPI
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://nexus_fi_backend;
    }

    # -------------------------------------------------------------------------
    # Páginas de error personalizadas
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# =============================================================================
# SECCIÓN COMENTADA: Configuración para AWS ALB (Application Load Balancer)
#
# Descomenta este bloque cuando despliegues detrás de un ALB de AWS.
# El ALB agrega la IP real del cliente en el header X-Forwarded-For,
# pero su propia IP puede aparecer como $remote_addr.
# Usa set_real_ip_from para que Nginx confíe en esas IPs como proxy.
# =============================================================================

# # Rango de IPs del AWS ALB y redes privadas de EC2 / VPC:
# set_real_ip_from   10.0.0.0/8;
# set_real_ip_from   172.16.0.0/12;
# set_real_ip_from   172.31.0.0/16;   # VPC default de AWS
# set_real_ip_from   192.168.0.0/16;
#
# # Obtener la IP real del cliente desde X-Forwarded-For
# real_ip_header     X-Forwarded-For;
#
# # Cuando hay múltiples IPs en X-Forwarded-For, usar la más reciente
# # que no sea de confianza (la del cliente original):
# real_ip_recursive  on;
#
# NOTA: Con esta configuración, FastAPI recibirá en request.client.host
# la IP REAL del cliente (no la del ALB), lo que permite al middleware
# IPFilterMiddleware (WBS 1.3.5) validar correctamente el perímetro
# institucional de la Facultad de Ingeniería UAEMéx.
